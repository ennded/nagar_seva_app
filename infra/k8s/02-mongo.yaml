# Dev/early-stage only. Recommended production path is a managed MongoDB (e.g. Atlas) —
# swap MONGODB_URI in the Secret and remove this StatefulSet + Service when you do.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: nagar-seva
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: nagar-seva
spec:
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017
