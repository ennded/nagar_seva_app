apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nagar-seva
spec:
  replicas: 2
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: nagar-seva/notification-service:latest
          ports:
            - containerPort: 4002
          env:
            - name: NOTIFICATION_SERVICE_PORT
              value: "4002"
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: nagar-seva-secrets, key: MONGODB_URI } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: nagar-seva-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /healthz, port: 4002 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: nagar-seva
spec:
  selector: { app: notification-service }
  ports:
    - port: 4002
      targetPort: 4002
