apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: nagar-seva
spec:
  replicas: 2
  selector:
    matchLabels: { app: core-service }
  template:
    metadata:
      labels: { app: core-service }
    spec:
      containers:
        - name: core-service
          image: nagar-seva/core-service:latest
          ports:
            - containerPort: 4001
          env:
            - name: CORE_SERVICE_PORT
              value: "4001"
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: nagar-seva-secrets, key: MONGODB_URI } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: nagar-seva-secrets, key: JWT_SECRET } }
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: NOTIFICATION_INTERNAL_URL
              value: "http://notification-service:4002/internal"
            - name: SMS_PROVIDER
              value: "console"
          readinessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: nagar-seva
spec:
  selector: { app: core-service }
  ports:
    - port: 4001
      targetPort: 4001
