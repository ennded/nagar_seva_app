apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: nagar-seva
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: nagar-seva/api-gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: GATEWAY_PORT
              value: "4000"
            - name: CORE_SERVICE_GRAPHQL_URL
              value: "http://core-service:4001/graphql"
            - name: NOTIFICATION_SERVICE_GRAPHQL_URL
              value: "http://notification-service:4002/graphql"
          readinessProbe:
            httpGet: { path: /healthz, port: 4000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: nagar-seva
spec:
  selector: { app: api-gateway }
  ports:
    - port: 4000
      targetPort: 4000
